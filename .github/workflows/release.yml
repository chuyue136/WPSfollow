name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: ${{ github.ref_name }} 测试版
          body_path: docs/releases/${{ github.ref_name }}.md
          files: WpsInkSync/icpx/WpsInkSync.icpx
